name: Perform Benchmarks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop


concurrency:
  group: benchmarks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true


env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  BRANCH_NAME: ${{ github.base_ref || github.ref_name }}
  PUSH_TO_BENCHMARKS: false
  COMMENT_ALWAYS: true

jobs:
  benchmark-then-upload:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        repository: tudo-seal/cosy-benchmarks
        ref: 'gh-pages'

    - uses: actions/checkout@v6
      with:
        # Full history for timestamps
        fetch-depth: 0
        path: 'cosy-nested'

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install Hatch
      uses: pypa/hatch@install

    - name: Run Benchmark Suite
      run: hatch test benchmarks --benchmark-json benchmarks.json
      working-directory: 'cosy-nested'

    - name: Upload Benchmarks
      uses: actions/upload-artifact@v4
      with:
        name: benchmarks.json
        path: cosy-nested/benchmarks.json
