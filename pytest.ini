[pytest]
# Pytest configuration for deterministic testing

# PYTHONHASHSEED and Determinism:
# ================================
#
# Some tests (particularly test_symbolic_regression_demo) require deterministic
# hash ordering in sets and dicts. This is controlled by the PYTHONHASHSEED
# environment variable, which must be set BEFORE Python starts.
#
# PYTHONHASHSEED is a Python-level limitation: it cannot be set within pytest config
# or via os.environ - it MUST be set in the shell environment before pytest runs.
#
# Options to run tests with deterministic behavior:
#
# 1. Using the provided wrapper script (RECOMMENDED):
#    python run_pytest.py
#    python run_pytest.py tests/test_evolutionary.py -v
#    python run_pytest.py --collect-only
#
# 2. Manual environment variable (shell):
#    PYTHONHASHSEED=0 python -m pytest
#    PYTHONHASHSEED=0 python -m pytest tests/test_evolutionary.py -v
#
# 3. For CI/CD pipelines:
#    Include 'PYTHONHASHSEED=0' before the pytest command



